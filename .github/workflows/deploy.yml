name: Deploy

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

# Never cancel a release halfway through.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_FLAGS_RELEASE="-O3"
          -DENABLE_NATIVE_OPTIMIZATIONS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests
        run: ./build/matching_engine_tests

      - name: Smoke test the engine
        run: |
          set -euo pipefail
          printf '0,1,0,10,1000000\n0,2,1,10,1000000\n' | ./build/matching_engine > /dev/null

      - name: Package release bundle
        run: |
          set -euo pipefail
          name="matching-engine-${GITHUB_REF_NAME}-linux-x86_64"
          stage="staging/${name}"
          mkdir -p "${stage}/bin" dist
          install -m 0755 build/matching_engine "${stage}/bin/"
          install -m 0755 build/matching_engine_benchmark "${stage}/bin/"
          install -m 0644 README.md LICENSE.txt test_data.txt "${stage}/"
          tar -C staging -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          ls -lh dist

      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${tag}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${tag}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${tag}" \
              --generate-notes \
              --latest
          fi
